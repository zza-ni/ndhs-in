<body>
    <div
        style="margin: 0 auto; text-align: center; display: flex; align-items: center; justify-content: center; gap: 12px;">

        <input type="radio" id="tab6" name="tab">
        <label for="tab6">토</label>

        <input type="radio" id="tab7" name="tab">
        <label for="tab7">일</label>

    <div class="menu-wrapper">

    <div id="pwa-snackbar" style="display:none;">
        <div class="snackbar-content">
            <div>
                <strong>홈 화면에 행운의 아이콘을</strong>

                    남도밥🍀을 심어보세요!<br>
                </div>
            </div>
            <button id="snackbar-install-btn">설치</button>
        </div>
    </div>

    <div class="modal" id="modal-ios-install" style="display:none;">
        <div class="modal-content">
            <img src="./src/ios-app-icon.png" alt="앱 아이콘" width="48" height="48">
            <h2>남도밥</h2>
            <div class="modal-guide">
                <p><img src="./src/ios-share.png" alt="공유 버튼" width="17" style="vertical-align:middle">
                    &nbsp; 버튼을 누르고 <b style="color:blue">홈 화면에 추가하기</b></p>
            </div>
            <button class="modal-close" onclick="this.parentElement.parentElement.style.display='none'">닫기</button>
        </div>
    </div>

    <div class="modal" id="modal-get-push" style="display:none;">
        <div class="modal-content">
            <h2>알림 받기</h2>
            <p>매일 규칙적인 식사로 건강을 챙겨보세요!</p>
            <button id="btnRequestPush" class="modal-close"
                onclick="this.parentElement.parentElement.style.display='none';">닫기</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./src/service-worker.js');
            navigator.serviceWorker.register('./firebase-messaging-sw.js');
        }
    </script>

    <script src="./src/script.js"></script>

    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-analytics.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-messaging.js";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyCeqeuQkTb3wioxIogkn7hcUQz9FP2K1XA",
            authDomain: "ndhs-bob.firebaseapp.com",
            projectId: "ndhs-bob",
            storageBucket: "ndhs-bob.firebasestorage.app",
            messagingSenderId: "109335510565",
            appId: "1:109335510565:web:8777eb5e791089da23c9cc",
            measurementId: "G-32BMZXN9CQ"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const messaging = getMessaging(app);

        // 알림 권한 관련
        let pushAlreadyRequested = false; // 같은 세션 중복 방지
        let savedToken = localStorage.getItem('savedPushToken');
        const btn = document.getElementById('btnRequestPush');
        const modalPush = document.getElementById('modal-get-push');

        // 모달 표시 함수
        function showModal() {
            modalPush.style.display = 'flex';
        }

        // 권한 상태 체크 후 모달 띄우기
        function checkAndShowModal() {
            if (isInStandaloneMode() & Notification.permission === 'default' && !pushAlreadyRequested) {
                showModal();
            } else {
                modalPush.style.display = 'none';
            }
        }

        // 페이지 로딩 시 저장 토큰 있으면 요청 안 함, 아니면 권한 체크 후 모달 띄움
        if (savedToken) {
            pushAlreadyRequested = true;
            modalPush.style.display = 'none';
        } else {
            checkAndShowModal();
        }

        btn.addEventListener("click", () => {
            if (pushAlreadyRequested) {
                console.log("이미 푸시 권한 요청 및 토큰 저장을 완료했습니다.");
                modalPush.style.display = 'none';
                return;
            }

            Notification.requestPermission().then((permission) => {
                if (permission === "granted") {
                    btn.disabled = true;

                    getToken(messaging, { vapidKey: "BCnsNKzhkJVouCCvFADUHBuzW6PUZTNDiuJOEfpGY-Psgn9dGX9rJBTUmyfoUbNyhHmesHJoXKehoLfZPG-LrZI" })
                        .then((currentToken) => {
                            if (!currentToken) {
                                console.log("토큰을 받을 수 없습니다.");
                                btn.disabled = false;
                                return;
                            }

                            console.log("FCM 토큰:", currentToken);

                            if (currentToken === savedToken) {
                                console.log("이미 동일한 토큰이 저장되어 있어 fetch를 생략합니다.");
                                pushAlreadyRequested = true;
                                btn.disabled = false;
                                modalPush.style.display = 'none';
                                return;
                            }

                            fetch("./api/saveToken", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ token: currentToken }),
                            })
                                .then(res => res.json())
                                .then(data => {
                                    console.log(data.message);
                                    pushAlreadyRequested = true;
                                    localStorage.setItem('pushRegistered', 'true');
                                    localStorage.setItem('savedPushToken', currentToken);
                                    btn.disabled = false;
                                    modalPush.style.display = 'none';
                                })
                                .catch(err => {
                                    console.error("토큰 저장 요청 실패:", err);
                                    btn.disabled = false;
                                });
                        })
                        .catch((err) => {
                            console.error("토큰 요청 중 오류:", err);
                            btn.disabled = false;
                        });

                } else if (permission === "denied") {
                    console.log("푸시 알림 권한이 거부되었습니다.");
                    modalPush.style.display = 'none';
                    pushAlreadyRequested = true; // 더 이상 요청하지 않게 처리
                } else {
                    // permission === "default" 상태 (사용자가 아무 결정도 하지 않았을 때)
                    console.log("알림 권한 미결정 상태, 다시 모달 띄움");
                    modalPush.style.display = 'flex';
                    // 버튼 비활성화 해제, 사용자에게 계속 선택 유도
                }
            });
        });

        // 만약 모달 닫기 버튼이 존재한다면, 닫기 눌렀을 때도 권한 상태가 default라면 모달 유지 또는 다시 띄우도록 처리 가능
        const closeBtn = modalPush.querySelector('.modal-close');
        if (closeBtn) {
            closeBtn.addEventListener('click', () => {
                if (Notification.permission === 'default') {
                    // 권한이 결정되지 않은 경우 모달 유지, 권한 요청은 버튼을 눌러야 함
                    modalPush.style.display = 'flex';
                } else {
                    modalPush.style.display = 'none';
                }
            });
        }


    </script>
