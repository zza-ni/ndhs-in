<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>남도밥</title>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="./src/style.css">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
    <script src="src/script.js"></script>
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
    <meta name="robots" content="index, nofollow" />
    <meta http-equiv="refresh" content="600" />
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="남도밥은 남도학숙의 식단을 제공합니다.">
    <meta property="og:title" content="남도밥 - 남도학숙 식단표">
    <meta property="og:description" content="오늘은 어떤 메뉴가 있을까요? 남도밥에서 남도학숙 식단을 확인하세요!">
    <meta property="og:image" content="./favicon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FFFEE6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-status-bar-style" content="#FFFEE6">
</head>

<body>
    <div
        style="margin: 0 auto; text-align: center; display: flex; align-items: center; justify-content: center; gap: 12px;">
        <button id="prev-week" class="week-control">&#60;</button>
        <div>
            <p class="today-date" style="font-size: 1.2em; font-weight: 500; color: #333; margin: 0;"></p>
        </div>
        <button id="next-week" class="week-control">&#62;</button>
    </div>

    <div class="segmented-control">
        <input type="radio" id="tab1" name="tab">
        <label for="tab1">월</label>

        <input type="radio" id="tab2" name="tab">
        <label for="tab2">화</label>

        <input type="radio" id="tab3" name="tab">
        <label for="tab3">수</label>

        <input type="radio" id="tab4" name="tab">
        <label for="tab4">목</label>

        <input type="radio" id="tab5" name="tab">
        <label for="tab5">금</label>

        <input type="radio" id="tab6" name="tab">
        <label for="tab6">토</label>

        <input type="radio" id="tab7" name="tab">
        <label for="tab7">일</label>
    </div>

    <div class="menu-wrapper">
    </div>

    <div id="pwa-snackbar" style="display:none;">
        <div class="snackbar-content">
            <div>
                <strong>홈 화면에 행운의 아이콘을</strong>
                <div class="snackbar-desc">
                    남도밥🍀을 심어보세요!<br>
                </div>
            </div>
            <button id="snackbar-install-btn">설치</button>
        </div>
    </div>

    <div id="ios-install-modal" style="display:none;">
        <div class="ios-modal-content">
            <img src="/src/ios-app-icon.png" alt="앱 아이콘" width="48" height="48">
            <h2>남도밥</h2>
            <p><img src="/src/ios-share.png" alt="공유 버튼" width="22" style="vertical-align:middle">
                &nbsp; 버튼을 눌러 <b>홈 화면에 추가하기</b></p>
            <div class="ios-guide"></div>
            <button id="ios-modal-close">닫기</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./src/service-worker.js');
            navigator.serviceWorker.register('/firebase-messaging-sw.js');
        }
    </script>

    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-analytics.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-messaging.js";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyCeqeuQkTb3wioxIogkn7hcUQz9FP2K1XA",
            authDomain: "ndhs-bob.firebaseapp.com",
            projectId: "ndhs-bob",
            storageBucket: "ndhs-bob.firebasestorage.app",
            messagingSenderId: "109335510565",
            appId: "1:109335510565:web:8777eb5e791089da23c9cc",
            measurementId: "G-32BMZXN9CQ"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const messaging = getMessaging(app);

        document.getElementById('snackbar-install-btn').addEventListener("click", () => {
            Notification.requestPermission().then((permission) => {
                if (permission === "granted") {
                    getToken(messaging, { vapidKey: "BCnsNKzhkJVouCCvFADUHBuzW6PUZTNDiuJOEfpGY-Psgn9dGX9rJBTUmyfoUbNyhHmesHJoXKehoLfZPG-LrZI" })
                        .then((currentToken) => {
                            if (currentToken) {
                                console.log("FCM 토큰:", currentToken);
                                fetch("/.netlify/functions/saveToken", {
                                    method: "POST",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({ token: currentToken }),
                                })
                                    .then(res => res.json())
                                    .then(data => {
                                        console.log(data.message);
                                    })
                                    .catch(err => {
                                        console.error("토큰 저장 요청 실패:", err);
                                    });
                            } else {
                                console.log("토큰을 받을 수 없습니다.");
                            }
                        })
                        .catch((err) => {
                            console.error("토큰 요청 중 오류:", err);
                        });
                } else {
                    console.log("푸시 알림 권한이 거부되었습니다.");
                }
            });
        });
    </script>
</body>

</html>
